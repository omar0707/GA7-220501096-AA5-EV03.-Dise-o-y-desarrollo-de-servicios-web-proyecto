# ==============================================================================
# CONFIGURACION SPRING BOOT - CANSTYLING API REST (GUIA 7 PROYECTO)
# ==============================================================================

spring.application.name=canstyling-api-proyecto

# Servidor Web
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# Multipart / Carga de Archivos (Fotos de Mascotas Antes/Despues)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Mensajes JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Bogota

# Logging
logging.level.com.canstyling=INFO
logging.level.org.springframework.web=INFO

# ========================================================
# CONEXION BASE DE DATOS MYSQL (XAMPP)
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/peluqueria_canina_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# OPTIMIZACION DE ALTO RENDIMIENTO PARA DATOS MOVILES Y PRODUCCION
# ==============================================================================
# 1. Compresion GZIP automatica (Reduce peso de transferencia en un 75%-80%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/x-javascript
server.compression.min-response-size=1024

# 2. Cache HTTP para Recursos Estaticos (0 KB en visitas recurrentes del cliente)
spring.web.resources.chain.cache=true
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true