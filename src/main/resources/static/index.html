    // ==========================================
    // 11. VISTA: ÁLBUM DIGITAL (PÚBLICO CON ANTI-IDOR)
    // ==========================================
    function AlbumDigitalView({ citas, initialToken, usuarioAuth, showNotif }) {
      const [tokenInput, setTokenInput] = useState(initialToken || '');
      const [currentCita, setCurrentCita] = useState(() => citas.find(c => c.tokenAcceso === initialToken) || citas[0]);
      const [errorIdor, setErrorIdor] = useState(false);
      const [publicadas, setPublicadas] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('canstyling_galeria_publica') || '[]');
        } catch (e) {
          return [];
        }
      });

      const handleBuscar = () => {
        if (/^\d+$/.test(tokenInput) || tokenInput.length < 10) {
          setErrorIdor(true);
          setCurrentCita(null);
          return;
        }
        const found = citas.find(c => c.tokenAcceso === tokenInput);
        if (found) {
          setCurrentCita(found);
          setErrorIdor(false);
        } else {
          setErrorIdor(true);
          setCurrentCita(null);
        }
      };

      const estaPublicada = currentCita && publicadas.some(p =>
        (p.tokenAcceso && p.tokenAcceso === currentCita.tokenAcceso) ||
        (p.idCita && currentCita.idCita && Number(p.idCita) === Number(currentCita.idCita))
      );

      const handleTogglePublicar = () => {
        if (!currentCita) return;
        let actualizadas;
        if (estaPublicada) {
          actualizadas = publicadas.filter(p =>
            !(p.tokenAcceso && p.tokenAcceso === currentCita.tokenAcceso) &&
            !(p.idCita && currentCita.idCita && Number(p.idCita) === Number(currentCita.idCita))
          );
          if (showNotif) showNotif(`🗑️ La transformación de ${currentCita.mascota} fue retirada del Home.`);
        } else {
          const itemNuevo = {
            idCita: currentCita.idCita,
            tokenAcceso: currentCita.tokenAcceso,
            mascota: currentCita.mascota,
            raza: currentCita.raza || 'Canino',
            servicio: currentCita.servicio,
            cliente: currentCita.cliente,
            estilistaNombre: currentCita.estilistaNombre,
            fecha: currentCita.fecha,
            notasEstilista: currentCita.notasEstilista || '',
            fotoAntes: currentCita.fotoAntes || (currentCita.fotos?.find(f => f.tipoFoto === 'ANTES')?.urlFoto) || null,
            fotoDespues: currentCita.fotoDespues || (currentCita.fotos?.find(f => f.tipoFoto === 'DESPUES')?.urlFoto) || null,
            videoEvidencia: currentCita.videoEvidencia || null
          };
          actualizadas = [itemNuevo, ...publicadas.filter(p => p.tokenAcceso !== currentCita.tokenAcceso)];
          if (showNotif) showNotif(`🌟 ¡Transformación de ${currentCita.mascota} publicada con éxito en el Home!`);
        }
        setPublicadas(actualizadas);
        try {
          localStorage.setItem('canstyling_galeria_publica', JSON.stringify(actualizadas));
        } catch (e) {}
      };

      return (
        <div className="max-w-3xl mx-auto space-y-4">
          <div className="glass-panel p-4 rounded-3xl flex gap-2 shadow-md">
            <input
              type="text"
              placeholder="Ingrese Token UUID Anti-IDOR (ej: e4b2d18a-78f9-4c12-98ab-34cd56ef7890)..."
              value={tokenInput}
              onChange={e => setTokenInput(e.target.value)}
              className="border p-2.5 rounded-xl text-xs flex-1 bg-slate-50 font-mono font-bold"
            />
            <button onClick={handleBuscar} className="bg-slate-900 text-white text-xs font-bold px-5 rounded-xl shadow">
              Consultar
            </button>
          </div>

          {errorIdor && (
            <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-3xl text-xs font-bold text-center">
              🚫 ACCESO DENEGADO (Protección Anti-IDOR): No se permite acceso mediante identificadores numéricos. Requiere Token criptográfico UUID v4 válido registrado.
            </div>
          )}

          {currentCita && (
            <div className="glass-panel p-6 rounded-3xl shadow-xl space-y-5">
              <div className="text-center border-b pb-4">
                <span className="text-[10px] bg-emerald-100 text-emerald-800 font-extrabold px-3 py-1 rounded-full uppercase">Álbum Digital Oficial</span>
                <h2 className="text-2xl font-black text-slate-900 mt-2">Transformación de {currentCita.mascota}</h2>
                <p className="text-xs text-slate-500">Tutor: {currentCita.cliente} • {currentCita.servicio} • Estilista: <b>{currentCita.estilistaNombre || 'Mateo Ríos'}</b></p>
                {currentCita.notasEstilista && (
                  <p className="text-xs bg-slate-100 p-2.5 rounded-xl text-slate-700 mt-2 italic">
                    💬 "{currentCita.notasEstilista}"
                  </p>
                )}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <span className="text-xs font-bold text-slate-600 block mb-1">Antes del Servicio:</span>
                  {currentCita.fotoAntes ? (
                    <img src={currentCita.fotoAntes} className="w-full h-52 object-cover rounded-2xl shadow" />
                  ) : (
                    <div className="w-full h-52 bg-slate-100 rounded-2xl flex items-center justify-center text-xs text-slate-400">
                      Sin foto previa registrada
                    </div>
                  )}
                </div>
                <div>
                  <span className="text-xs font-bold text-emerald-700 block mb-1">¡Resultado Final! (Después):</span>
                  {currentCita.fotoDespues ? (
                    <img src={currentCita.fotoDespues} className="w-full h-52 object-cover rounded-2xl shadow border-2 border-emerald-500" />
                  ) : (
                    <div className="w-full h-52 bg-slate-100 rounded-2xl flex items-center justify-center text-xs text-slate-400 border-2 border-dashed border-slate-300">
                      Servicio en proceso / Pendiente de foto final
                    </div>
                  )}
                </div>
              </div>

              {/* BOTÓN Y ESTADO DE PUBLICACIÓN EN LA GALERÍA DEL HOME */}
              <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t">
                <div className="text-xs text-slate-500 flex items-center gap-1.5">
                  {estaPublicada ? (
                    <span className="text-emerald-700 font-bold bg-emerald-50 px-3 py-1 rounded-xl border border-emerald-200">
                      🌟 Publicada actualmente en la Galería del Home
                    </span>
                  ) : (
                    <span className="text-slate-500">
                      🔒 Álbum privado (Solo visible con Token de Acceso)
                    </span>
                  )}
                </div>
                <div>
                  <button
                    type="button"
                    onClick={handleTogglePublicar}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow ${
                      estaPublicada
                        ? 'bg-rose-100 hover:bg-rose-200 text-rose-800 border border-rose-300'
                        : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                    }`}
                    title="Publicar las fotos y videos de este servicio en el Home para que los visitantes puedan apreciarlo"
                  >
                    <span>{estaPublicada ? '🗑️ Retirar del Home' : '🌟 Publicar en el Home (Galería Pública)'}</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 12. VISTA: CITAS (DATATABLES CON ESTILISTA Y ANTI-IDOR)
    // ==========================================
    function CitasView({ citas, estilistas, services, onAgendar, onActualizarCita, onAprobarRecepcion, onEliminarFoto, onEliminarTodasFotos, onVerAlbum }) {
      const [filtro, setFiltro] = useState('TODAS');
      const [filtroEstilista, setFiltroEstilista] = useState('TODOS');
      const [busqueda, setBusqueda] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [citaEditando, setCitaEditando] = useState(null);
      const [citaAprobando, setCitaAprobando] = useState(null);

      const citasPendientesAprob = (citas || []).filter(c => c.estado === 'PENDIENTE_APROBACION');

      const filtered = (citas || []).filter(c => {
        const matchesEstado = filtro === 'TODAS' || c.estado === filtro;
        const matchesEstilista = filtroEstilista === 'TODOS' || (c.idEstilista && c.idEstilista === parseInt(filtroEstilista)) || (c.estilistaNombre && c.estilistaNombre.includes(filtroEstilista));
        const matchesBusq = String(c.cliente || '').toLowerCase().includes(busqueda.toLowerCase()) || 
                            String(c.mascota || '').toLowerCase().includes(busqueda.toLowerCase()) ||
                            String(c.correoCliente || '').toLowerCase().includes(busqueda.toLowerCase()) ||
                            String(c.tokenAcceso || '').toLowerCase().includes(busqueda.toLowerCase()) ||
                            String(c.estilistaNombre || '').toLowerCase().includes(busqueda.toLowerCase());
        return matchesEstado && matchesEstilista && matchesBusq;
      });

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h2 className="text-xl font-black text-slate-900">Agenda de Citas & Turnos</h2>
              <p className="text-xs text-slate-500">Base de datos de turnos con conexión directa a clientes, mascotas, recepción y estilistas.</p>
            </div>
            <button onClick={() => setShowModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow transition flex items-center gap-1.5">
              <span>+</span> Agendar Nueva Cita
            </button>
          </div>

          {/* ALERTA DE CITAS PENDIENTES DE APROBACIÓN POR RECEPCIÓN */}
          {citasPendientesAprob.length > 0 && (
            <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 p-4 rounded-2xl shadow flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <div className="flex items-center gap-3">
                <span className="text-2xl">🔔</span>
                <div>
                  <h3 className="font-black text-sm text-slate-950">
                    {citasPendientesAprob.length} Turno(s) Finalizados por el Estilista en Espera de Aprobación
                  </h3>
                  <p className="text-xs text-slate-900 font-medium">

    function ModalEditarCita({ cita, estilistas, onClose, onGuardar }) {
      const [estilistaSel, setEstilistaSel] = useState(cita.idEstilista || 1);
      const [estadoSel, setEstadoSel] = useState(cita.estado || 'PENDIENTE');

      const handleSave = (e) => {
        e.preventDefault();
        const estObj = estilistas.find(e => e.idEstilista === parseInt(estilistaSel));
        onGuardar({
          idEstilista: parseInt(estilistaSel),
          estilistaNombre: estObj ? estObj.nombre : cita.estilistaNombre,
          estado: estadoSel
        });
      };

      return (
        <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">

            <p className="text-xs text-slate-500">Mascota: <b>{cita.mascota}</b> • Tutor: <b>{cita.cliente}</b></p>
            
            <form onSubmit={handleSave} className="space-y-3 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Estilista Responsable:</label>

                  value={estilistaSel}

                  className="w-full border p-2 rounded-xl bg-slate-50 font-bold text-amber-900"
                >
                  {estilistas.map(est => (
                    <option key={est.idEstilista} value={est.idEstilista}>✂️ {est.nombre} [{est.estado}]</option>

              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Estado de Atención:</label>

                  value={estadoSel}
                  onChange={e => setEstadoSel(e.target.value)}
                  className="w-full border p-2 rounded-xl bg-slate-50 font-bold"
                >
                  <option value="PENDIENTE">PENDIENTE</option>
                  <option value="EN_PROCESO">EN_PROCESO</option>

    // MODAL DE VERIFICACIÓN DE CALIDAD Y APROBACIÓN POR PARTE DE RECEPCIÓN Y ADMINISTRADOR
    function ModalAprobarCita({ cita, onClose, onAprobar, onEliminarFoto, onEliminarTodasFotos }) {
      const [verificado, setVerificado] = useState(true);
      const [fotosLocales, setFotosLocales] = useState(() => cita.fotos || []);

      useEffect(() => {
        setFotosLocales(cita.fotos || []);
      }, [cita.fotos]);

      const handleConfirmar = (notificarWhatsApp = false) => {
        onAprobar(cita.idCita);
        if (notificarWhatsApp) {
          const tel = limpiarTelefono(cita.telefono);
          const host = window.location.origin || 'http://localhost:8080';
          const linkAlbum = `${host}/api/index.html?token=${cita.tokenAcceso}`;
          const msg = encodeURIComponent(
            `Hola ${cita.cliente}, te saludamos de CanStyling. Nos alegra informarte que el servicio de ${cita.servicio} para tu consentido ${cita.mascota} ha finalizado con total exito y maxima calidad 🐾✨. Puedes ver sus fotografias de transformacion en su Album Digital interactivo aqui: ${linkAlbum}`
          );
          if (tel) {
            window.open(`https://wa.me/57${tel}?text=${msg}`, '_blank');
          } else {
            window.open(`https://wa.me/?text=${msg}`, '_blank');
          }
        }
      };

      const handleEliminarUnaFoto = (idFoto) => {
        if (!confirm("¿Desea eliminar esta fotografía del turno?")) return;
        setFotosLocales(prev => prev.filter(f => f.idFoto !== idFoto));
        if (onEliminarFoto) onEliminarFoto(cita.idCita, idFoto);
      };

      const handleEliminarTodas = () => {
        if (onEliminarTodasFotos) {
          onEliminarTodasFotos(cita.idCita);
          setFotosLocales([]);
        }
      };

      return (
        <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b pb-3">
              <div>
                <span className="text-[10px] bg-amber-100 text-amber-900 font-extrabold px-2.5 py-0.5 rounded-full uppercase">
                  Revisión de Calidad - Recepción & Admin
                </span>
                <h3 className="text-lg font-black text-slate-900 mt-1">Verificar Trabajo: Cita #{cita.idCita}</h3>
                <p className="text-xs text-slate-500">Mascota: <b>{cita.mascota}</b> • Tutor: <b>{cita.cliente}</b> ({cita.telefono || 'Sin tel'})</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            </div>

            <div className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-50 p-3 rounded-2xl border">
                <div>
                  <span className="text-slate-400 text-[10px] font-bold uppercase block">Servicio Realizado:</span>
                  <span className="font-bold text-slate-800">{cita.servicio}</span>
                </div>
                <div>
                  <span className="text-slate-400 text-[10px] font-bold uppercase block">Estilista Responsable:</span>
                  <span className="font-bold text-amber-900">✂️ {cita.estilistaNombre}</span>
                </div>
              </div>

              {/* GALERÍA DE FOTOS REGISTRADAS CON PODER DE ELIMINACIÓN POR RECEPCIÓN */}
              <div className="space-y-2">
                <div className="flex justify-between items-center">
                  <span className="font-bold text-slate-800 text-xs flex items-center gap-1.5">
                    <span>📸</span> Fotografías y Evidencias de Avance ({fotosLocales.length}):
                  </span>
                  {fotosLocales.length > 0 && (
                    <button
                      type="button"
                      onClick={handleEliminarTodas}
                      className="text-[10px] bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-2 py-1 rounded-lg border border-rose-200 transition"
                    >
                      🗑️ Eliminar Todas las Fotos
                    </button>
                  )}
                </div>

                {fotosLocales.length === 0 ? (
                  <div className="p-6 bg-slate-50 rounded-2xl border border-dashed text-center text-slate-400 text-xs">
                    Sin fotografías adjuntas para este turno.
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {fotosLocales.map((f, i) => (
                      <div key={f.idFoto || i} className="relative group bg-slate-50 border rounded-2xl overflow-hidden p-1 shadow-sm">
                        <img src={f.urlFoto} alt="Evidencia" className="w-full h-32 object-cover rounded-xl" />
                        <div className="mt-1 flex items-center justify-between px-1">
                          <span className={`text-[9px] font-black px-1.5 py-0.5 rounded ${
                            f.tipoFoto === 'DESPUES' ? 'bg-emerald-100 text-emerald-800' :
                            f.tipoFoto === 'PROCESO' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {f.tipoFoto || 'ANTES'}
                          </span>
                          <button
                            type="button"
                            onClick={() => handleEliminarUnaFoto(f.idFoto)}
                            className="text-[10px] text-rose-600 hover:text-rose-800 font-bold hover:bg-rose-50 p-1 rounded transition"
                            title="Eliminar esta foto"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* EVIDENCIA EN VIDEO SI EXISTE */}
              {cita.videoEvidencia && (
                <div className="p-3 bg-purple-50 rounded-xl border border-purple-200">
                  <span className="font-bold text-purple-900 block text-[11px]">📹 Enlace o Evidencia de Video:</span>
                  <p className="text-[11px] text-purple-700 break-all">{cita.videoEvidencia}</p>
                </div>
              )}

              {/* OBSERVACIONES DEL ESTILISTA */}
              <div className="p-3 bg-slate-50 rounded-xl border">
                <span className="font-bold text-slate-700 block text-[11px]">📝 Novedades Clínicas / Observaciones del Estilista:</span>
                <p className="text-slate-600 mt-1 italic">{cita.notasEstilista || 'Sin novedades clínicas reportadas por el estilista.'}</p>
              </div>

              <div className="p-3 bg-emerald-50 rounded-2xl border border-emerald-200 flex items-start gap-2">
                <input
                  type="checkbox"
                  id="chkVerificadoRecepcion"
                  checked={verificado}
                  onChange={e => setVerificado(e.target.checked)}
                  className="mt-0.5 rounded text-emerald-600"
                />
                <label htmlFor="chkVerificadoRecepcion" className="text-[11px] text-emerald-900 font-semibold cursor-pointer">
                  Confirmo que verifiqué que el trabajo cumple con los estándares de calidad de corte, baño y bienestar canino. Recepción y Admin son los únicos autorizados para remitir el resultado final al tutor.
                </label>
              </div>

              <div className="flex flex-col sm:flex-row justify-end gap-2 pt-2 border-t">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl"
                >
                  Cerrar
                </button>
                <button
                  type="button"
                  disabled={!verificado}
                  onClick={() => handleConfirmar(false)}
                  className="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 disabled:opacity-50 text-white font-bold rounded-xl shadow transition"
                >
                  ✅ Aprobar Interno
                </button>
                <button
                  type="button"
                  disabled={!verificado}
                  onClick={() => handleConfirmar(true)}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-black rounded-xl shadow flex items-center justify-center gap-1.5 transition"
                >
                  <span>💬</span> Aprobar y Notificar con Álbum (WhatsApp)
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

      const [busqueda, setBusqueda] = useState('');

      const esEstilista = usuarioAuth?.rol === 'ESTILISTA';

      // Formulario nuevo cliente

        nombres: '',
        apellidos: '',
        correo: '',
        telefono: '',
        direccion: '',
        nombreMascota: '',
        razaMascota: 'Poodle (Caniche)',
        pesoMascota: '5.0',
        temperamentoMascota: 'Dócil',
        alergiasMascota: ''
      });

      // Formulario agregar mascota a cliente existente
      const [formNuevaMascota, setFormNuevaMascota] = useState({
        nombre: '',
        raza: 'Poodle (Caniche)',
        peso: '5.0',
        temperamento: 'Dócil',
        alergias: ''
      });

      const clientesFiltrados = (clients || []).filter(c => {
        if (!busqueda.trim()) return true;
        const term = busqueda.toLowerCase().trim();
        const matchCliente = String(c.nombres || '').toLowerCase().includes(term) ||
                             String(c.apellidos || '').toLowerCase().includes(term) ||
                             String(c.correo || '').toLowerCase().includes(term) ||
                             String(c.idCliente || '').includes(term);
        const matchTelefonos = (c.telefonos || []).some(t => String(t.num || '').includes(term));
        const matchMascotas = (c.mascotas || []).some(m =>
          String(m.nombre || '').toLowerCase().includes(term) ||
          String(m.raza || '').toLowerCase().includes(term) ||
          String(m.temperamento || '').toLowerCase().includes(term)
        );
        return matchCliente || matchTelefonos || matchMascotas;
      });

      const handleGuardarNuevoCliente = (e) => {
        e.preventDefault();
        if (!formCliente.nombres.trim() || !formCliente.correo.trim()) return;

        const nextId = clients.length > 0 ? Math.max(...clients.map(c => c.idCliente)) + 1 : 1;

          idCliente: nextId,
          idUsuario: null,
          correo: formCliente.correo.toLowerCase().trim(),

          apellidos: formCliente.apellidos.trim(),

          telefonos: [{ num: formCliente.telefono.trim() || '3000000000', tipo: "WHATSAPP" }],
          mascotas: formCliente.nombreMascota.trim() ? [{
            idMascota: nextId * 10,
            nombre: formCliente.nombreMascota.trim(),
            raza: formCliente.razaMascota,
            peso: parseFloat(formCliente.pesoMascota || 5.0),

          nombres: '',
          apellidos: '',
          correo: '',
          telefono: '',
          direccion: '',
          nombreMascota: '',
          razaMascota: 'Poodle (Caniche)',

    // ==========================================
    // 16. VISTA: APP DEL PELUQUERO (RESPONSIVA)
    // ==========================================
    function PeluqueroResponsiveView({ usuarioAuth, citas, estilistas, initialCitaId, onVolverMisTurnos, onCompletar, onActualizarCita, onVerAlbum }) {
      const [verTodas, setVerTodas] = useState(false);
      
      const citasFiltradas = verTodas || usuarioAuth?.rol === 'ADMINISTRADOR'
        ? citas
        : citas.filter(c => c.correoCliente !== usuarioAuth?.correo && (c.idEstilista === usuarioAuth?.idUsuario || c.estilistaNombre?.includes(usuarioAuth?.nombres || '') || c.estilistaNombre === 'Mateo Alejandro Ríos Herrera' || !c.idEstilista));

      const listaCitas = citasFiltradas.length > 0 ? citasFiltradas : citas;

      const [selectedCitaId, setSelectedCitaId] = useState(() => initialCitaId || listaCitas[0]?.idCita || 1);
      const [fotosAvance, setFotosAvance] = useState([]);
      const [tipoFotoSeleccionada, setTipoFotoSeleccionada] = useState('ANTES');
      const [videoEvidencia, setVideoEvidencia] = useState('');
      const [notas, setNotas] = useState('');

      // CONTROL DE MODAL DE CÁMARA WEBCAM DEL NAVEGADOR
      const [showCamModal, setShowCamModal] = useState(false);

      useEffect(() => {
        if (initialCitaId) {
          setSelectedCitaId(initialCitaId);
        }
      }, [initialCitaId]);

      const citaActiva = listaCitas.find(c => c.idCita === parseInt(selectedCitaId)) || listaCitas[0] || {
        idCita: 1,
        mascota: 'Sin Turno',
        raza: 'N/A',
        cliente: 'N/A',
        telefono: 'N/A',
        servicio: 'N/A',
        estado: 'PENDIENTE',
        fotos: [],
        videoEvidencia: null,
        notasEstilista: ''
      };

      const esFinalizada = citaActiva.estado === 'COMPLETADA';
      const esPendienteAprobacion = citaActiva.estado === 'PENDIENTE_APROBACION';
      const bloqueada = esFinalizada || esPendienteAprobacion;

      useEffect(() => {
        if (citaActiva) {
          setVideoEvidencia(citaActiva.videoEvidencia || '');
          setNotas(citaActiva.notasEstilista || '');
          setFotosAvance([]);
        }
      }, [selectedCitaId, citaActiva?.idCita]);

      const handleCargarFotoArchivo = async (e) => {
        if (bloqueada) return;
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImageFile(file, 1200, 1200, 0.82);
          if (compressed) {
            setFotosAvance(prev => [
              ...prev,
              { tipoFoto: tipoFotoSeleccionada, urlFoto: compressed, mimeType: 'image/jpeg', fileSize: 120000 }
            ]);
          }
        }
      };

      const handleCapturaCamara = (dataUrl) => {
        setFotosAvance(prev => [
          ...prev,
          { tipoFoto: tipoFotoSeleccionada, urlFoto: dataUrl, mimeType: 'image/jpeg', fileSize: 120000 }
        ]);
        setShowCamModal(false);
      };

      // INICIAR CORTE / ATENCIÓN: El estilista notifica al tutor el inicio de trabajo
      const handleIniciarAtencion = () => {
        onCompletar(citaActiva.idCita, fotosAvance, videoEvidencia, notas || citaActiva.notasEstilista, 'EN_PROCESO');
        
        // Notificación opcional directa al cliente vía WhatsApp de inicio de servicio
        if (citaActiva.telefono) {
          const tel = limpiarTelefono(citaActiva.telefono);
          const msg = encodeURIComponent(
            `Hola ${citaActiva.cliente}, te saludamos de CanStyling. Te informamos que tu mascota ${citaActiva.mascota} ya ha ingresado a nuestra mesa de estilismo y hemos iniciado su sesion de ${citaActiva.servicio} ✂️🐾.`
          );
          window.open(`https://wa.me/57${tel}?text=${msg}`, '_blank');
        }
      };

      // GUARDAR AVANCE EN MESA: Persiste fotos y notas en MySQL sin finalizar
      const handleGuardarAvance = (e) => {
        e.preventDefault();
        onCompletar(
          citaActiva.idCita,
          fotosAvance,
          videoEvidencia,
          notas,
          citaActiva.estado
        );
        setFotosAvance([]);
      };

    function EditorTemasAdmin({ themeSettings, setThemeSettings, temaOscuro, setTemaOscuro, showNotif }) {
      const [modoEdicion, setModoEdicion] = useState(() => (temaOscuro ? 'dark' : 'light'));
      const [paletaTemp, setPaletaTemp] = useState(() => {
        return JSON.parse(JSON.stringify(themeSettings || DEFAULT_THEME_PALETTES));
      });

      useEffect(() => {
        if (themeSettings) {
          setPaletaTemp(JSON.parse(JSON.stringify(themeSettings)));
        }
      }, [themeSettings]);

      const paletaActual = paletaTemp[modoEdicion] || DEFAULT_THEME_PALETTES[modoEdicion];

      const handleColorChange = (key, nuevoHex) => {
        const updated = {
          ...paletaTemp,
          [modoEdicion]: {
            ...paletaTemp[modoEdicion],
            [key]: nuevoHex
          }
        };
        setPaletaTemp(updated);
        setThemeSettings(updated);
      };

      const handleLightnessChange = (key, currentHex, targetLightness) => {
        const nuevoHex = adjustHexLightness(currentHex, parseInt(targetLightness));
        handleColorChange(key, nuevoHex);
      };

      const handleRestablecerModo = () => {
        const updated = {
          ...paletaTemp,
          [modoEdicion]: { ...DEFAULT_THEME_PALETTES[modoEdicion] }
        };
        setPaletaTemp(updated);
        setThemeSettings(updated);
        if (showNotif) showNotif(`✔ Paleta del ${modoEdicion === 'dark' ? 'Modo Oscuro' : 'Modo Claro'} restablecida a los valores oficiales.`);
      };

      const handleRestablecerTodo = () => {
        const reset = JSON.parse(JSON.stringify(DEFAULT_THEME_PALETTES));
        setPaletaTemp(reset);
        setThemeSettings(reset);
        if (showNotif) showNotif("✔ Paletas de Modo Claro y Modo Oscuro restablecidas a los estándares de CanStyling.");
      };

      const handleGuardarPaleta = () => {
        setThemeSettings(paletaTemp);
        saveStorage('theme_custom_palette', paletaTemp);
        if (showNotif) showNotif("✔ Configuración de temas y paleta visual guardada en el sistema.");
      };

      const camposColor = [
        {
          key: 'bgFondo',
          label: 'Fondo General de Pantalla',
          desc: 'Color de fondo envolvente del sitio, páginas y secciones.',
          defaultHex: DEFAULT_THEME_PALETTES[modoEdicion].bgFondo
        },
        {
          key: 'bgSuperficie',
          label: 'Superficie de Tarjetas y Paneles',
          desc: 'Fondo de contenedores, tarjetas de citas, tablas y modales.',
          defaultHex: DEFAULT_THEME_PALETTES[modoEdicion].bgSuperficie
        },
        {
          key: 'colorTexto',

    function HistorialAtencionesView({ citas, onVerAlbum }) {
      const [busqueda, setBusqueda] = useState('');
      const [filtroEstado, setFiltroEstado] = useState('TODOS');

      // Filtrado dinámico en tiempo real por Correo, Nombre de Mascota y Tutor/Cliente
      const citasFiltradas = (citas || []).filter(c => {
        const query = busqueda.toLowerCase().trim();
        const coincideTexto = !query ||
          String(c.correoCliente || '').toLowerCase().includes(query) ||
          String(c.mascota || '').toLowerCase().includes(query) ||
          String(c.cliente || '').toLowerCase().includes(query) ||
          String(c.servicio || '').toLowerCase().includes(query) ||
          String(c.estilistaNombre || '').toLowerCase().includes(query) ||
          String(c.idCita || '').includes(query);

        const coincideEstado = filtroEstado === 'TODOS' ||
          (filtroEstado === 'COMPLETADA' && c.estado === 'COMPLETADA') ||
          (filtroEstado === 'PENDIENTE_APROBACION' && c.estado === 'PENDIENTE_APROBACION') ||
          (filtroEstado === 'EN_PROCESO' && c.estado === 'EN_PROCESO') ||
          (filtroEstado === 'PENDIENTE' && c.estado === 'PENDIENTE');

        return coincideTexto && coincideEstado;
      });

      const totalCompletadas = (citas || []).filter(c => c.estado === 'COMPLETADA').length;
      const totalEnRevision = (citas || []).filter(c => c.estado === 'PENDIENTE_APROBACION').length;
      const totalEnMesa = (citas || []).filter(c => c.estado === 'EN_PROCESO').length;

      return (
        <div className="space-y-6">
          {/* BANNER PRINCIPAL DEL HISTORIAL */}
          <div className="bg-gradient-to-r from-slate-950 via-slate-900 to-emerald-950 text-white p-6 md:p-8 rounded-3xl shadow-xl border border-emerald-900/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] bg-emerald-500/20 text-emerald-400 font-black px-3 py-1 rounded-full uppercase border border-emerald-500/40">
                  Expediente Clínico & Auditoría
                </span>
                <span className="text-[10px] bg-slate-800 text-slate-300 font-bold px-2 py-0.5 rounded-full">

              <div className="bg-amber-900/40 border border-amber-500/30 p-3 rounded-2xl text-center flex-1 md:w-28">
                <span className="text-amber-400 text-lg font-black block">{totalEnRevision}</span>
                <span className="text-[10px] text-slate-300">En Revisión</span>

              <div className="bg-blue-900/40 border border-blue-500/30 p-3 rounded-2xl text-center flex-1 md:w-28">

            </div>
          </div>

          {/* BARRA DE BÚSQUEDA Y FILTROS EN TIEMPO REAL */}

            <div className="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
              {/* INPUT DE BÚSQUEDA */}

                <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                  🔍
                </span>
                <input
                  type="text"
                  value={busqueda}
                  onChange={e => setBusqueda(e.target.value)}

                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-100 pb-3">
                      <div className="flex items-center gap-3">
                        <span className="bg-slate-900 text-white font-black px-3 py-1 rounded-xl text-xs">
                          Turno #{c.idCita}
                        </span>
                        <div>
                          <span className="text-xs text-slate-500 font-semibold">📅 {c.fecha} • ⏱ {c.hora}</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`text-[11px] font-black px-3 py-1 rounded-full border ${badgeStyle}`}>
                          {c.estado === 'COMPLETADA' ? '✅ Calidad Aprobada / Finalizada' :
                           c.estado === 'PENDIENTE_APROBACION' ? '⏳ En Revisión de Calidad (Recepción)' :
                           c.estado === 'EN_PROCESO' ? '✂️ En Mesa de Estilismo' : '📅 Pendiente'}
                        </span>
                        <button
                          onClick={() => onVerAlbum(c.tokenAcceso)}
                          className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl shadow flex items-center gap-1.5"
                        >
                          <span>🖼️</span> Ver Álbum Digital
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
                      {/* PACIENTE CANINO */}
                      <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-1">
                        <span className="text-[10px] font-extrabold text-slate-400 uppercase">Paciente Canino</span>
                        <h4 className="font-black text-slate-900 text-sm flex items-center gap-1">
                          <span>🐶</span> {c.mascota}
                        </h4>
                        <p className="text-slate-600 font-medium">Raza: {c.raza || 'Mestizo'}</p>
                      </div>

                      {/* TUTOR / CLIENTE */}
                      <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-1">
                        <span className="text-[10px] font-extrabold text-slate-400 uppercase">Tutor Responsable</span>
                        <h4 className="font-black text-slate-900 text-sm">{c.cliente}</h4>
                        <p className="text-slate-600 font-mono text-[11px]">{c.correoCliente || 'Sin correo registrado'}</p>
                        <p className="text-emerald-700 font-bold">📞 {c.telefono || 'Sin teléfono'}</p>
                      </div>

                      {/* SERVICIO & ESTILISTA */}
                      <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-1">
                        <span className="text-[10px] font-extrabold text-slate-400 uppercase">Servicio Realizado</span>
                        <h4 className="font-bold text-slate-900">{c.servicio}</h4>
                        <p className="text-emerald-700 font-black">${Number(c.precio || 0).toLocaleString()} COP</p>
                        <p className="text-slate-500 text-[11px]">✂️ Estilista: <strong className="text-slate-700">{c.estilistaNombre || 'Mateo Ríos'}</strong></p>
                      </div>

                      {/* EVIDENCIA FOTOGRÁFICA / NOTAS */}
                      <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-1.5 flex flex-col justify-between">
                        <div>
                          <span className="text-[10px] font-extrabold text-slate-400 uppercase">Evidencia & Notas</span>
                          <p className="text-slate-700 italic text-[11px] line-clamp-2 mt-0.5">
                            {c.notasEstilista ? `"${c.notasEstilista}"` : 'Sin notas clínicas registradas.'}
                          </p>
                        </div>
                        <div className="flex items-center gap-2 pt-1">
                          {c.fotoAntes ? (
                            <div className="relative group">
                              <img src={c.fotoAntes} alt="Antes" className="w-9 h-9 object-cover rounded-lg border border-slate-300" />
                              <span className="text-[8px] absolute -bottom-1 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-1 rounded">Antes</span>
                            </div>
                          ) : (
                            <span className="text-[10px] text-slate-400">Sin foto antes</span>
                          )}
                          {c.fotoDespues ? (
                            <div className="relative group">
                              <img src={c.fotoDespues} alt="Después" className="w-9 h-9 object-cover rounded-lg border border-emerald-300" />
                              <span className="text-[8px] absolute -bottom-1 left-1/2 -translate-x-1/2 bg-emerald-700 text-white px-1 rounded">Después</span>
                            </div>
                          ) : (
                            <span className="text-[10px] text-slate-400">Sin foto después</span>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>,
      document.getElementById('root')
    );
  </script>
</body>
</html>
