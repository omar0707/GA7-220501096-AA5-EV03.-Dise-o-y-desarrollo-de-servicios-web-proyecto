<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanStyling - Sistema Integral & Portal Seguro (Guía 7 - AA5-EV03)</title>
  
  <!-- Meta Tags de Rendimiento Móvil y PWA -->
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">

  <!-- Recursos Locales Zero-CDN (Carga inmediata a velocidad LAN/WiFi, inmune a caídas de datos móviles) -->
  <script src="./vendor/tailwind.min.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      console.warn('Cargando respaldo de Tailwind...');
      document.write('<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script>');
    }
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Paleta CanStyling: inspirada en el mural del local (crema, turquesa, negro cálido)
            brand: { 50: '#E8F7F5', 500: '#4FBDAE', 600: '#3AA396', 700: '#2C8074' },
            corporate: { 800: '#201A14', 900: '#1C1712' },
            // slate -> se recorre a tonos crema/carbón cálidos (mismo contraste, otro matiz)
            slate: {
              50: '#FDFBF6', 100: '#FAF3E0', 150: '#F5EAD1', 200: '#F0E4C8',
              300: '#D9C79E', 400: '#A68A5C', 500: '#6B5636', 600: '#4A3B24',
              700: '#2E2419', 800: '#201A14', 900: '#1C1712', 950: '#120E0A'
            },
            // emerald -> turquesa del mural (color de acción principal)
            emerald: {
              50: '#E8F7F5', 100: '#CDEEE9', 500: '#4FBDAE', 600: '#3AA396',
              700: '#2C8074', 800: '#1F5F56'
            },
            // purple (rol Administrador) -> terracota, distinto y cálido, no compite con el turquesa
            purple: {
              50: '#F5E9E0', 100: '#EDD6C4', 500: '#A0623E', 600: '#8B4A2E',
              700: '#6B3720', 800: '#4A2716'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM & Babel Locales Zero-CDN (Carga instantánea sin gastar datos del cliente) -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script>
    if (typeof React === 'undefined') {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
    if (typeof Babel === 'undefined') {
      document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');
    }
  </script>

  <style>

/* ==========================================================================
   CANSTYLING DESIGN TOKENS OFICIALES (CLARO / OSCURO)
   Específicamente protegidos contra auto-inversión de temas de navegadores
   ========================================================================== */
:root {
  color-scheme: light;
  --bg-fondo: #FBF7EE;          /* Crema */
  --bg-superficie: #FFFFFF;     /* Blanco */
  --bg-superficie-hover: #F8F4EA;
  --color-texto: #2E2218;       /* Café oscuro */
  --color-texto-muted: #6B5636; /* Café medio */
  --color-borde: #E6D8BE;       /* Beige */
  --btn-principal: #2563EB;     /* Azul */
  --btn-principal-hover: #1D4ED8;
  --btn-secundario: #0D9488;    /* Turquesa */
  --btn-secundario-hover: #0F766E;
  --adv-bg: #FEF3C7;            /* Amarillo suave */
  --adv-texto: #92400E;         /* Ámbar oscuro */
  --adv-borde: #FDE68A;
  --cream:#FBF7EE; --cream-2:#F5E9C8; --ink:#2E2218; --ink-soft:#6B5636;
  --teal:#0D9488; --teal-dk:#0F766E; --gold:#E8B84B; --blue:#2563EB;
  --border:#E6D8BE; --card:#FFFFFF;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg-fondo: #FBF7EE;          /* Crema */
  --bg-superficie: #FFFFFF;     /* Blanco */
  --bg-superficie-hover: #F8F4EA;
  --color-texto: #2E2218;       /* Café oscuro */
  --color-texto-muted: #6B5636; /* Café medio */
  --color-borde: #E6D8BE;       /* Beige */
  --btn-principal: #2563EB;     /* Azul */
  --btn-principal-hover: #1D4ED8;
  --btn-secundario: #0D9488;    /* Turquesa */
  --btn-secundario-hover: #0F766E;
  --adv-bg: #FEF3C7;            /* Amarillo suave */
  --adv-texto: #92400E;         /* Ámbar oscuro */
  --adv-borde: #FDE68A;
  --cream:#FBF7EE; --cream-2:#F5E9C8; --ink:#2E2218; --ink-soft:#6B5636;
  --teal:#0D9488; --teal-dk:#0F766E; --gold:#E8B84B; --blue:#2563EB;
  --border:#E6D8BE; --card:#FFFFFF;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-fondo: #14100D;          /* Café casi negro */
  --bg-superficie: #221B16;     /* Café oscuro */
  --bg-superficie-hover: #2D241E;
  --color-texto: #F7EEDD;       /* Crema claro */
  --color-texto-muted: #D9C79E; /* Crema suave */
  --color-borde: #3E3125;       /* Café medio */
  --btn-principal: #3B82F6;     /* Azul ligeramente más brillante */
  --btn-principal-hover: #60A5FA;
  --btn-secundario: #14B8A6;    /* Turquesa */
  --btn-secundario-hover: #2DD4BF;
  --adv-bg: #3A280F;            /* Ámbar suave */
  --adv-texto: #FDE047;         /* Ámbar / amarillo brillante */
  --adv-borde: #684B18;
  --cream:#14100D; --cream-2:#221B16; --ink:#F7EEDD; --ink-soft:#D9C79E;
  --teal:#14B8A6; --teal-dk:#2DD4BF; --gold:#FDE047; --blue:#3B82F6;
  --border:#3E3125; --card:#221B16;
}

/* Insignia protectora para el logo corporativo CanStyling */
.logo-badge, .brand-mark-img {
  background: var(--bg-superficie) !important;
  padding: 3px 6px;
  border-radius: 12px;
  border: 1px solid var(--color-borde) !important;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
}

/* Clases de Superficie y Tokens Semánticos CanStyling */
.app-root {
  background-color: var(--bg-fondo) !important;
  color: var(--color-texto) !important;
}

.card-superficie {
  background-color: var(--bg-superficie) !important;
  color: var(--color-texto) !important;
  border-color: var(--color-borde) !important;
  transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.nav-superficie {
  background-color: var(--bg-superficie) !important;
  color: var(--color-texto) !important;
  border-color: var(--color-borde) !important;
}

.texto-principal {
  color: var(--color-texto) !important;
}

.texto-muted {
  color: var(--color-texto-muted) !important;
}

.alerta-advertencia {
  background-color: var(--adv-bg) !important;
  color: var(--adv-texto) !important;
  border-color: var(--adv-borde) !important;
}

/* Reglas de Alto Contraste en Modo Oscuro - Selectores directos */
:root[data-theme="dark"] body,
:root[data-theme="dark"] .bg-slate-50,
:root[data-theme="dark"] .min-h-screen {
  background-color: var(--bg-fondo) !important;
  color: var(--color-texto) !important;
}

:root[data-theme="dark"] header.gemini-nav,
:root[data-theme="dark"] header {
  background-color: var(--bg-superficie) !important;
  border-color: var(--color-borde) !important;
  color: var(--color-texto) !important;
}

:root[data-theme="dark"] .glass-panel,
:root[data-theme="dark"] .menu-board,
:root[data-theme="dark"] .story-card,
:root[data-theme="dark"] .bg-white {
  background-color: var(--bg-superficie) !important;
  color: var(--color-texto) !important;
  border-color: var(--color-borde) !important;
}

:root[data-theme="dark"] .text-slate-900,
:root[data-theme="dark"] .text-slate-800,
:root[data-theme="dark"] h1,
:root[data-theme="dark"] h2,
:root[data-theme="dark"] h3,
:root[data-theme="dark"] h4,
:root[data-theme="dark"] .hero h1 {
  color: var(--color-texto) !important;
}

:root[data-theme="dark"] .text-slate-700,
:root[data-theme="dark"] .text-slate-600,
:root[data-theme="dark"] .hero p {
  color: var(--color-texto-muted) !important;
}

:root[data-theme="dark"] .text-slate-500,
:root[data-theme="dark"] .text-slate-400 {
  color: var(--color-texto-muted) !important;
}

:root[data-theme="dark"] input,
:root[data-theme="dark"] select,
:root[data-theme="dark"] textarea {
  background-color: #1A140F !important;
  color: var(--color-texto) !important;
  border-color: var(--color-borde) !important;
}

:root[data-theme="dark"] input::placeholder,
:root[data-theme="dark"] textarea::placeholder {
  color: #8C785B !important;
}

/* Reglas de Alto Contraste en Modo Claro */
:root[data-theme="light"] body,
:root[data-theme="light"] .bg-slate-50,
:root[data-theme="light"] .min-h-screen {
  background-color: var(--bg-fondo) !important;
  color: var(--color-texto) !important;
}

:root[data-theme="light"] header.gemini-nav,
:root[data-theme="light"] header {
  background-color: var(--bg-superficie) !important;
  border-color: var(--color-borde) !important;
  color: var(--color-texto) !important;
}

:root[data-theme="light"] .glass-panel,
:root[data-theme="light"] .menu-board,
:root[data-theme="light"] .story-card,
:root[data-theme="light"] .bg-white {
  background-color: var(--bg-superficie) !important;
  color: var(--color-texto) !important;
  border-color: var(--color-borde) !important;
}

:root[data-theme="light"] h1,
:root[data-theme="light"] h2,
:root[data-theme="light"] h3,
:root[data-theme="light"] h4,
:root[data-theme="light"] .hero h1 {
  color: var(--color-texto) !important;
}

:root[data-theme="light"] .hero p {
  color: var(--color-texto-muted) !important;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg-fondo: #14100D;
    --bg-superficie: #221B16;
    --bg-superficie-hover: #2D241E;
    --color-texto: #F7EEDD;
    --color-texto-muted: #D9C79E;
    --color-borde: #3E3125;
    --btn-principal: #3B82F6;
    --btn-principal-hover: #60A5FA;
    --btn-secundario: #14B8A6;
    --btn-secundario-hover: #2DD4BF;
    --adv-bg: #3A280F;
    --adv-texto: #FDE047;
    --adv-borde: #684B18;
    --cream:#14100D; --cream-2:#221B16; --ink:#F7EEDD; --ink-soft:#D9C79E;
    --teal:#14B8A6; --teal-dk:#2DD4BF; --gold:#FDE047; --blue:#3B82F6;
    --border:#3E3125; --card:#221B16;
  }
}

*{box-sizing:border-box;}
html,body{min-height:100%;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:'Fraunces',serif; margin:0; font-weight:600;}
img,svg{max-width:100%;}
.wrap{max-width:1040px; margin:0 auto; padding:0 24px;}
a,button{font-family:inherit;}

/* header */
header.gemini-nav{position:sticky; top:0; z-index:40; background:var(--cream); border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top,0px);}
.nav-row{display:flex; align-items:center; justify-content:space-between; padding:12px 24px; max-width:1040px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:23px; color:var(--ink); text-decoration:none;}
.brand-mark-img{height:42px; width:auto; object-fit:contain; display:block;}
.nav-links{display:flex; gap:26px; list-style:none; margin:0; padding:0;}
.nav-links a{color:var(--ink-soft); text-decoration:none; font-size:14.5px; font-weight:500;}
.nav-links a:hover{color:var(--ink);}
.nav-cta{background:var(--teal); color:#fff; border:none; padding:10px 18px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
.ham{display:none; width:38px; height:38px; border-radius:9px; border:1px solid var(--border); background:transparent; font-size:17px; cursor:pointer; color:var(--ink);}
.mobile-panel{display:none; flex-direction:column; gap:2px; padding:8px 24px 16px; border-top:1px solid var(--border); background:var(--cream);}
.mobile-panel a, .mobile-panel button.link-btn{padding:10px 6px; color:var(--ink-soft); text-decoration:none; font-size:15px; border-bottom:1px solid var(--border); text-align:left; background:none; border-top:none; border-left:none; border-right:none; cursor:pointer; width:100%;}
.mobile-panel.open{display:flex;}
@media (max-width:760px){
  .nav-links, .nav-cta, .nav-actions-desktop{display:none;}
  .ham{display:block;}
}

/* hero */
.hero{position:relative; padding:56px 24px; overflow:hidden;}
.hero-inner{max-width:1040px; margin:0 auto; display:grid; grid-template-columns:1.05fr 0.95fr; gap:36px; align-items:center;}
.hero h1{font-size:clamp(32px,4.6vw,52px); line-height:1.08; max-width:11ch;}
.hero h1 em{font-style:italic; color:var(--teal-dk);}
.hero p{font-size:16px; color:var(--ink-soft); max-width:46ch; margin:18px 0 26px; line-height:1.6;}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
.btn-primary{background:var(--ink); color:var(--cream); border:none; padding:13px 22px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer;}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--ink); padding:13px 22px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer;}

/* contenedor de imagen del hero */
.hero-emblem-container{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
}
.hero-emblem-crop{
  width:100%;
  max-width:390px;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:24px;
  display:flex;
  justify-content:center;
  align-items:center;
}

@media(max-width:760px){
  .hero-inner{grid-template-columns:1fr;}
  .hero-emblem-container{order:-1; margin-bottom:10px;}
  .hero-emblem-crop{max-width:310px;}
}

/* videos destacados */
.featured-videos{padding-top:20px;}
.video-home-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px;}
.video-home-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;}
.video-feature{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:18px;background:var(--ink);min-height:330px;}
.video-feature.main{min-height:390px;}
.video-feature .video-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:linear-gradient(145deg,var(--ink),var(--teal-dk));color:var(--cream);}
.video-feature .play{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);font-size:23px;padding-left:3px;box-shadow:0 8px 22px rgba(0,0,0,.2);}
.video-feature .video-label{font-size:13px;opacity:.9;}
.video-feature .video-caption{position:absolute;left:0;right:0;bottom:0;padding:22px 20px 18px;background:linear-gradient(transparent,rgba(36,28,20,.92));color:#fff;}
.video-feature .video-caption strong{display:block;font-family:'Fraunces',serif;font-size:21px;margin-bottom:3px;}
.video-feature .video-caption span{font-size:12.5px;opacity:.9;}
.video-side{display:grid;grid-template-rows:1fr 1fr;gap:16px;}
.video-side .video-feature{min-height:0;}
.video-home-note{margin-top:14px;color:var(--ink-soft);font-size:12.5px;}
@media(max-width:760px){
  .video-home-grid{grid-template-columns:1fr;}
  .video-side{grid-template-columns:1fr 1fr;grid-template-rows:none;}
  .video-feature.main{min-height:300px;}
  .video-side .video-feature{min-height:210px;}
  .video-home-head{display:block;}
}
@media(max-width:520px){
  .video-side{grid-template-columns:1fr;}
  .video-side .video-feature{min-height:220px;}
}

/* servicios */
.section{padding:56px 24px; max-width:1040px; margin:0 auto;}
.section h2{font-size:30px; margin-bottom:8px;}
.section .lead{color:var(--ink-soft); font-size:15px; max-width:52ch; margin:0 0 30px;}
.tabs{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}
.tab{background:transparent; border:1px solid var(--border); color:var(--ink-soft); padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer;}
.tab.active{background:var(--ink); color:var(--cream); border-color:var(--ink);}
.menu-board{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:8px 28px;}
.menu-item{display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:18px 0; border-bottom:1px dashed var(--border);}
.menu-item:last-child{border-bottom:none;}
.menu-item .name{font-family:'Fraunces',serif; font-size:18px;}
.menu-item .desc{color:var(--ink-soft); font-size:13.5px; margin-top:3px; max-width:42ch;}
.menu-item .price{font-family:'Fraunces',serif; font-size:18px; color:var(--teal-dk); white-space:nowrap;}

/* historias públicas */
.stories-intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px;}
.stories-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.story-card{overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:16px;}
.story-media{position:relative;aspect-ratio:4/3;background:var(--cream-2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.story-media.photo{background:var(--cream-2);}
.story-media.video{background:var(--ink);color:var(--cream);}
.story-media .media-placeholder{font-size:42px;opacity:.9;}
.story-media .media-type{position:absolute;right:10px;top:10px;padding:6px 9px;border-radius:999px;background:rgba(36,28,20,.82);color:#fff;font-size:12px;font-weight:600;}
.story-body{padding:15px;}
.story-head{display:flex;justify-content:space-between;gap:10px;align-items:start;}
.story-name{font-family:'Fraunces',serif;font-size:19px;}
.story-date{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
.story-breed{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.story-comment{font-size:13.5px;line-height:1.5;margin:12px 0 14px;color:var(--ink-soft);}
.story-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.story-link{color:var(--teal-dk);font-size:13px;font-weight:700;text-decoration:none;}
.story-share{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.public-note{background:var(--cream-2);border:1px dashed var(--border);border-radius:14px;padding:14px 16px;margin-top:20px;color:var(--ink-soft);font-size:13px;line-height:1.5;}

/* por qué elegirnos */
.why-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px 32px;}
@media(max-width:640px){.why-grid{grid-template-columns:1fr;}}
.why-item{display:flex; gap:14px; align-items:flex-start;}
.why-mark{width:30px; height:30px; border-radius:50%; background:var(--gold); flex:none; display:flex; align-items:center; justify-content:center; font-size:14px;}
.why-item h3{font-size:16px; margin-bottom:4px;}
.why-item p{color:var(--ink-soft); font-size:14px; margin:0; line-height:1.55;}

/* testimonio */
.quote-block{background:var(--ink); color:var(--cream); border-radius:20px; padding:44px 36px;}
.quote-block blockquote{font-family:'Fraunces',serif; font-style:italic; font-size:22px; line-height:1.45; margin:0 0 16px; max-width:56ch;}
.quote-block .who{font-size:13.5px; opacity:0.75;}

/* faq */
.faq-item{border-bottom:1px solid var(--border);}
.faq-q{width:100%; text-align:left; background:none; border:none; padding:18px 4px; font-size:15.5px; font-weight:600; color:var(--ink); display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.faq-a{max-height:0; overflow:hidden; transition:max-height 0.25s ease;}
.faq-a p{color:var(--ink-soft); font-size:14px; line-height:1.6; padding:0 4px 16px; margin:0;}
.faq-a.open{max-height:220px;}

/* cta + footer */
.cta-band{background:var(--teal); color:#fff; border-radius:20px; padding:44px 32px; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;}
.cta-band h2{color:#fff; font-size:26px;}
.cta-band .btn-primary{background:var(--ink);}
footer{padding:28px 24px 40px; text-align:center; color:var(--ink-soft); font-size:13px;}

.wa-float{position:fixed;right:18px;bottom:18px;z-index:35;background:var(--teal);color:#fff;text-decoration:none;border-radius:999px;padding:12px 16px;box-shadow:0 8px 22px rgba(0,0,0,.18);font-size:13px;font-weight:700;}
.mobile-bottom{display:none;}
@media(max-width:820px){ .stories-grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:640px){
  .stories-intro{display:block;}
  .stories-grid{grid-template-columns:1fr;}
  .story-media{aspect-ratio:16/10;}
  .wa-float{right:14px;bottom:72px;padding:11px 14px;}
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px));}
  .mobile-bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);height:62px;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--border);}
  .mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);text-decoration:none;font-size:10.5px;font-weight:600;}
  .mobile-bottom a span:first-child{font-size:18px;line-height:1;}
  .mobile-bottom a:last-child{color:var(--teal-dk);}
  .section{padding:46px 18px;}
  .menu-board{padding:6px 16px;}
  .hero{padding:42px 18px 40px;}
  .hero-actions{display:grid;grid-template-columns:1fr;}
  .hero-actions .btn-primary,.hero-actions .btn-ghost{width:100%;}
  .cta-band{padding:32px 22px;}
  .cta-band .btn-primary{width:100%;}
}

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary CanStyling capturó:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-900 text-white font-sans">

    // ==========================================
    // COMPONENTE: CAPTURA DE FOTOS EN VIVO DESDE LA CÁMARA / WEBCAM
    // ==========================================
    function CameraCaptureModal({ isOpen, onClose, onCapture, title = "Cámara del Estilista Canino" }) {
      const videoRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const [cameraError, setCameraError] = useState(null);
      const [facingMode, setFacingMode] = useState('environment');

      useEffect(() => {
        if (!isOpen) {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(track => track.stop());
            streamRef.current = null;
          }
          return;
        }

        setCameraError(null);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setCameraError("Su navegador o dispositivo no soporta acceso directo a cámara WebRTC.");
          return;
        }

        navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
        }).then(stream => {
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play().catch(() => {});
          }
        }).catch(err => {
          console.warn("Error accediendo a la cámara:", err);
          setCameraError("No se pudo iniciar la cámara (permiso denegado o dispositivo ocupado). Verifique los permisos de cámara de su navegador.");
        });

        return () => {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(track => track.stop());
            streamRef.current = null;
          }
        };
      }, [isOpen, facingMode]);

      const handleTomarFoto = () => {
        if (!videoRef.current) return;
        const video = videoRef.current;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        onCapture(dataUrl);
        onClose();
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-2">
              <div className="flex items-center gap-2">
                <span className="text-xl">📸</span>
                <h3 className="text-base font-black text-slate-900">{title}</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
            </div>

            {cameraError ? (
              <div className="p-4 bg-rose-50 border border-rose-200 rounded-2xl text-rose-800 text-xs space-y-2">
                <p className="font-bold">⚠️ Acceso a Cámara No Disponible:</p>
                <p>{cameraError}</p>
                <p className="text-slate-600">Puede continuar utilizando el botón de selección de archivo de foto.</p>
              </div>
            ) : (
              <div className="relative rounded-2xl overflow-hidden bg-slate-950 aspect-video flex items-center justify-center shadow-inner">
                <video ref={videoRef} playsInline muted autoPlay className="w-full h-full object-cover" />
                <div className="absolute top-3 left-3 bg-red-600/90 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full flex items-center gap-1.5 animate-pulse">
                  <span className="w-2 h-2 rounded-full bg-white"></span> EN VIVO / CÁMARA
                </div>
              </div>
            )}

              <button
                type="button"
                onClick={() => setFacingMode(prev => prev === 'environment' ? 'user' : 'environment')}
                className="text-xs font-bold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition"

                  className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white text-xs font-black rounded-xl shadow flex items-center gap-1.5"
                >
                  <span>📷</span> Tomar Fotografía
                </button>
              </div>
            </div>
          </div>
        </div>

      return new Promise((resolve) => {
        if (!file || !file.type.startsWith('image/')) {
          resolve(null);
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Intentar formato WebP de alta eficiencia; fallback automático a JPEG
            let compressedDataUrl = canvas.toDataURL('image/webp', quality);
            if (!compressedDataUrl.startsWith('data:image/webp')) {
              compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
            }
            resolve(compressedDataUrl);
          };
          img.onerror = () => resolve(event.target.result);
        };
        reader.onerror = () => resolve(null);
      });
    }

    function hexToHsl(hex) {
      if (!hex || typeof hex !== 'string') return { h: 0, s: 0, l: 50 };
      let c = hex.replace('#', '').trim();
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      if (c.length !== 6) return { h: 0, s: 0, l: 50 };
      const num = parseInt(c, 16);
      if (isNaN(num)) return { h: 0, s: 0, l: 50 };
      const r = ((num >> 16) & 255) / 255;
      const g = ((num >> 8) & 255) / 255;
      const b = (num & 255) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h = h * 60;
      }
      return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    function hslToHex(h, s, l) {
      const sNorm = Math.max(0, Math.min(100, s)) / 100;
      const lNorm = Math.max(0, Math.min(100, l)) / 100;
      const a = sNorm * Math.min(lNorm, 1 - lNorm);
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = lNorm - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * Math.max(0, Math.min(1, color))).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
    }

    function adjustHexLightness(hex, targetL) {
      try {
        const hsl = hexToHsl(hex);
        return hslToHex(hsl.h, hsl.s, Math.max(0, Math.min(100, targetL)));
      } catch (e) {
        return hex;
      }
    }

            showNotif("✔ ¡Guardado exitosamente en la Base de Datos MySQL (visible en phpMyAdmin)!");
          }
        }).catch(() => {
          console.log("Nota: Servidor backend en puerto 8080 desconectado; guardado localmente en navegador.");
        });
      };

      // AGREGAR MASCOTA A CLIENTE EXISTENTE (CON TEMPERAMENTO Y ALERGIAS/DESCRIPCIÓN)
      const handleAgregarMascotaACliente = (idCliente, nuevaMascota) => {
        const updated = clients.map(c => {
          if (c.idCliente === idCliente) {
            const list = c.mascotas || [];
            return {
              ...c,
              mascotas: [...list, nuevaMascota]
            };
          }
          return c;
        });
        setClients(updated);
        showNotif(`Mascota "${nuevaMascota.nombre}" registrada exitosamente con temperamento "${nuevaMascota.temperamento}".`);

        // Sincronizar mascota en MySQL si el backend está activo
        fetch(`${API_BASE}/clientes/${idCliente}/mascotas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idCliente: idCliente,
            idRaza: 1,
            nombre: nuevaMascota.nombre,
            genero: 'MACHO',
            pesoKg: nuevaMascota.peso,
            temperamento: (nuevaMascota.temperamento || 'DOCIL').toUpperCase().includes('BRAVO') ? 'AGRESIVO' : 'DOCIL',
            alergiasCondiciones: nuevaMascota.alergias,
            vacunasAlDia: true,
            estado: 'ACTIVO'
          })
        }).then(res => res.json()).then(data => {
          if (data && data.success && data.data) {
            const realId = data.data.idMascota || data.data.id_mascota;
            if (realId) {
              setClients(prev => prev.map(c => {
                if (c.idCliente === idCliente) {
                  return {
                    ...c,
                    mascotas: (c.mascotas || []).map(m =>
                      (m.idMascota === nuevaMascota.idMascota || m.nombre === nuevaMascota.nombre)
                        ? { ...m, idMascota: realId }
                        : m
                    )
                  };
                }
                return c;
              }));
              showNotif(`✔ Mascota "${nuevaMascota.nombre}" sincronizada en MySQL (ID #${realId}).`);
            }
          }
        }).catch(() => {});
      };

      // AGENDAR CITA CON CONEXIÓN RELACIONAL COMPLETA A ESTILISTA, CLIENTE, MASCOTA Y SERVICIO
      const handleAgendarCita = async (citaData) => {
        const uuidToken = 'c' + Math.random().toString(36).substring(2, 8) + '-' + Math.random().toString(36).substring(2, 4) + '-4ac2-98ab-' + Math.random().toString(36).substring(2, 12);
        
        // Determinar estilista asignado
        let estilistaAsignado = (estilistas || []).find(e => e.idEstilista === parseInt(citaData.idEstilista)) || estilistas[0] || { idEstilista: 1, nombre: 'Mateo Alejandro Ríos Herrera' };
        if (citaData.estilistaNombre) {
          const match = (estilistas || []).find(e => String(e.nombre || '').toLowerCase().includes(String(citaData.estilistaNombre || '').toLowerCase()));
          if (match) estilistaAsignado = match;
        }

        // Buscar cliente en el estado
        const correoCita = String(citaData.correoCliente || '').toLowerCase().trim();
        let clienteEncontrado = (clients || []).find(c => String(c?.correo || '').toLowerCase().trim() === correoCita);
        let idCli = citaData.idCliente ? Number(citaData.idCliente) : (clienteEncontrado ? clienteEncontrado.idCliente : (clients.length > 0 ? Math.max(...clients.map(c => c.idCliente)) + 1 : 1));

        // IDENTIFICAR EXACTAMENTE LA MASCOTA ELEGIDA (Por ID o por nombre)
        let mascotaEncontrada = null;
        if (clienteEncontrado && Array.isArray(clienteEncontrado.mascotas)) {
          if (citaData.idMascota) {
            mascotaEncontrada = clienteEncontrado.mascotas.find(m => Number(m.idMascota) === Number(citaData.idMascota));
          }
          if (!mascotaEncontrada && citaData.mascota) {
            mascotaEncontrada = clienteEncontrado.mascotas.find(m => String(m.nombre || '').toLowerCase().trim() === String(citaData.mascota || '').toLowerCase().trim());
          }
        }

        let idMasc = citaData.idMascota 
          ? Number(citaData.idMascota) 
          : (mascotaEncontrada ? Number(mascotaEncontrada.idMascota) : null);
        
        const nombreMascota = citaData.mascota || mascotaEncontrada?.nombre || 'Mi Mascota';
        const razaMascota = citaData.raza || mascotaEncontrada?.raza || 'Mestizo';

        // Si la mascota es nueva o no tiene ID en MySQL, crearla en el backend
        if ((!idMasc || idMasc <= 0) && idCli > 0) {
          try {
            const petResp = await fetch(`${API_BASE}/clientes/${idCli}/mascotas`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                idCliente: idCli,
                idRaza: 1,
                nombre: nombreMascota,
                genero: 'MACHO',
                pesoKg: 5.0,
                temperamento: 'DOCIL',
                alergiasCondiciones: 'Registrada durante agendamiento',
                vacunasAlDia: true,
                estado: 'ACTIVO'
              })
            });
            const petData = await petResp.json();
            if (petData && petData.success && petData.data) {
              idMasc = petData.data.idMascota || petData.data.id_mascota;
              setClients(prev => prev.map(c => c.idCliente === idCli ? {
                ...c,
                mascotas: [...(c.mascotas || []), {
                  idMascota: idMasc,
                  nombre: nombreMascota,
                  raza: razaMascota,
                  peso: 5.0,
                  temperamento: 'Dócil',
                  alergias: 'Ninguna conocida'
                }]
              } : c));
            }
          } catch (e) {
            console.error("Error auto-creando mascota:", e);
          }
        }

        if (!idMasc || idMasc <= 0) {
          idMasc = clienteEncontrado?.mascotas?.[0]?.idMascota || 1;
        }

        // Si el cliente no existe en el directorio de clientes, agregarlo automáticamente con su mascota
        if (!clienteEncontrado && correoCita) {
          const newCli = {
            idCliente: idCli,
            idUsuario: usuarioAuth?.idUsuario || null,
            correo: correoCita,
            nombres: (citaData.cliente || 'Cliente').split(' ')[0] || citaData.cliente,
            apellidos: (citaData.cliente || '').split(' ').slice(1).join(' ') || '',
            canal: "WEB",
            telefonos: [{ num: citaData.telefono || '3001234567', tipo: "WHATSAPP" }],
            mascotas: [{
              idMascota: idMasc,
              nombre: nombreMascota,
              raza: razaMascota,
              peso: 10.0,
              temperamento: "Dócil",
              alergias: "Ninguna conocida"
            }]
          };
          setClients([newCli, ...clients]);
        }

        // Encontrar servicio para obtener ID y categoría
        const servMatch = (services || []).find(s => String(s.nombre || '').toLowerCase() === String(citaData.servicio || '').toLowerCase());
        const idServ = servMatch ? servMatch.idServicio : 1;

        const newCita = {
          idCita: citas.length > 0 ? Math.max(...citas.map(c => c.idCita)) + 1 : 1,
          tokenAcceso: uuidToken,
          idCliente: idCli,
          idMascota: idMasc,
          idServicio: idServ,
          idEstilista: estilistaAsignado.idEstilista,
          estilistaNombre: estilistaAsignado.nombre,
          correoCliente: correoCita,
          cliente: citaData.cliente || 'Cliente CanStyling',
          telefono: citaData.telefono || '3001234567',
          mascota: nombreMascota,
          raza: razaMascota,
          servicio: citaData.servicio || 'Peluquería Canina',
          precio: parseFloat(citaData.precio || 50000),
          fecha: citaData.fecha || '2026-09-24',
          hora: citaData.hora || '10:00',
          estado: "PENDIENTE",
          origen: "WEB",
          fotoAntes: null,
          fotoDespues: null,
          videoEvidencia: null,
          notasEstilista: ""
        };

        const updatedCitas = [newCita, ...citas];
        setCitas(updatedCitas);
        showNotif(`✔ Cita #${newCita.idCita} agendada con éxito para ${newCita.mascota} con el estilista ${estilistaAsignado.nombre}.`);

        // Sincronizar cita con la Base de Datos MySQL vía API REST Java (puerto 8080)
        fetch(`${API_BASE}/citas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idCliente: newCita.idCliente,
            idMascota: newCita.idMascota,
            idServicio: newCita.idServicio,
            idEstilista: newCita.idEstilista,
            fechaCita: newCita.fecha,
            horaCita: (String(newCita.hora || '09:00').includes(':') && String(newCita.hora).split(':').length === 2)
              ? newCita.hora + ':00'
              : (newCita.hora || '09:00:00'),
            origenReserva: newCita.origen || 'WEB',
            observaciones: newCita.notasEstilista || ''
          })
        }).then(res => res.json()).then(data => {
          if (data && data.success && data.data && data.data.cita) {
            const dbCita = data.data.cita;
            setCitas(prev => prev.map(c => c.tokenAcceso === newCita.tokenAcceso ? {
              ...c,
              idCita: dbCita.idCita,
              tokenAcceso: dbCita.tokenAcceso
            } : c));
            showNotif(`✔ Cita #${dbCita.idCita} para ${nombreMascota} registrada en MySQL.`);
            recargarCitas();
          } else {
            const msgError = data?.message || 'Error desconocido al registrar cita en MySQL.';
            console.warn('⚠️ Backend rechazó la cita:', msgError);
            showNotif(`⚠️ ${msgError}`, 'error');
            alert(`No se pudo registrar la cita en MySQL:

${msgError}`);
            setCitas(prev => prev.filter(c => c.tokenAcceso !== newCita.tokenAcceso));
          }
        }).catch(err => {
          console.log('ℹ️ Servidor backend 8080 offline; cita guardada localmente en navegador.', err);
        });

        if (usuarioAuth && usuarioAuth.rol === 'CLIENTE') {
          setCurrentTab('portal_cliente');
        } else if (usuarioAuth && usuarioAuth.rol === 'ESTILISTA') {
          setCurrentTab('peluquero');
        } else {
          setCurrentTab('citas');
        }
      };

      // ACTUALIZAR O REASIGNAR ESTILISTA / ESTADO DE UNA CITA
      const handleActualizarCita = (idCita, updates) => {
        const updated = citas.map(c => {
          if (c.idCita === idCita) {
            return { ...c, ...updates };
          }
          return c;
        });
        setCitas(updated);
        showNotif(`Cita #${idCita} actualizada.`);

        if (updates.estado) {
          fetch(`${API_BASE}/citas/${idCita}/estado`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              estado: updates.estado,
              notas: updates.notasEstilista || updates.observaciones || ''
            })
          }).then(() => recargarCitas()).catch(() => {});
        }
      };

      // APROBACIÓN DE CALIDAD POR PARTE DE RECEPCIÓN / ADMINISTRACIÓN
      const handleAprobarRecepcion = (idCita) => {
        const updated = citas.map(c => {
          if (c.idCita === idCita) {
            return {
              ...c,
              estado: 'COMPLETADA',
              aprobadoPorRecepcion: true,
              fechaAprobacion: new Date().toISOString().replace('T', ' ').substring(0, 16)
            };
          }
          return c;
        });
        setCitas(updated);
        showNotif(`✔ Cita #${idCita} verificada y aprobada por Recepción. Historial clínico registrado en MySQL.`);

        // Sincronizar estado COMPLETADA e historial_atenciones en MySQL
        fetch(`${API_BASE}/citas/${idCita}/completar`, {
          method: 'PUT'
        }).then(res => res.json()).then(data => {
          if (data && data.success) {
            showNotif(`✔ Cita #${idCita} completada y registrada en historial de MySQL.`);
            recargarCitas();
          }
        }).catch(() => {});
      };

      // ELIMINACIÓN DE FOTOGRAFÍAS (SOLO RECEPCIÓN Y ADMINISTRADOR TIENEN CONTROL)
      const handleEliminarFotoCita = (idCita, idFoto) => {
        fetch(`${API_BASE}/citas/${idCita}/fotos/${idFoto}`, {
          method: 'DELETE'
        }).then(res => res.json()).then(data => {
          if (data && data.success) {
            showNotif("✔ Fotografía eliminada del turno.");
            recargarCitas();
          }
        }).catch(() => {});
      };

      const handleEliminarTodasFotosCita = (idCita) => {
        if (!confirm("¿Está seguro de eliminar todas las fotografías de este turno?")) return;
        fetch(`${API_BASE}/citas/${idCita}/fotos`, {
          method: 'DELETE'
        }).then(res => res.json()).then(data => {
          if (data && data.success) {
            showNotif("✔ Todas las fotografías del turno han sido eliminadas.");
            recargarCitas();
          }
        }).catch(() => {});
      };

      // COMPLETAR O GUARDAR ATENCIÓN POR EL PELUQUERO (ENVÍA A RECEPCIÓN PARA REVISIÓN)
      const handleCompletarPeluquero = (idCita, fotosNuevas, videoEvidencia, notas, nuevoEstado = 'PENDIENTE_APROBACION') => {
        const updated = citas.map(c => {
          if (c.idCita === idCita) {
            const fotosActuales = [...(c.fotos || [])];
            if (Array.isArray(fotosNuevas)) {
              fotosNuevas.forEach(fn => {
                if (!fotosActuales.some(fa => fa.urlFoto === fn.urlFoto)) fotosActuales.push(fn);
              });
            }
            return {
              ...c,
              estado: nuevoEstado,
              fotos: fotosActuales,
              videoEvidencia: videoEvidencia !== undefined ? videoEvidencia : c.videoEvidencia,
              notasEstilista: notas !== undefined ? notas : c.notasEstilista
            };
          }
          return c;
        });
        setCitas(updated);

        // Subir fotos a MySQL si se agregaron fotos nuevas
        if (Array.isArray(fotosNuevas) && fotosNuevas.length > 0) {
          fotosNuevas.forEach(fObj => {
            fetch(`${API_BASE}/citas/${idCita}/fotos`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                tipoFoto: fObj.tipoFoto || 'ANTES',
                urlFoto: fObj.urlFoto,
                mimeType: fObj.mimeType || 'image/jpeg',
                fileSize: fObj.fileSize || 1048576
              })
            }).catch(() => {});
          });
        }

        // Sincronizar en vivo el nuevo estado en MySQL
        fetch(`${API_BASE}/citas/${idCita}/estado`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            estado: nuevoEstado,
            notas: notas || ''
          })
        }).then(res => res.json()).then(data => {
          if (data && data.success) {
            setTimeout(recargarCitas, 500);
          }
        }).catch(() => {});

        if (nuevoEstado === 'PENDIENTE_APROBACION') {
          showNotif(`🔔 Cita #${idCita}: El estilista finalizó la atención. Se ha enviado a Recepción para revisión de calidad.`);
        } else if (nuevoEstado === 'EN_PROCESO') {
          showNotif("▶ Cita en proceso: Paciente ingresado a mesa de estilismo.");
        } else {
          showNotif("Avance fotográfico y observaciones guardados en la mesa de trabajo.");
        }
      };

      // ACTUALIZAR DATOS DE CONTACTO DE CLIENTE (DIRECCIÓN, TELÉFONO) CON VALIDACIÓN DE CÓDIGO
      const handleActualizarCliente = (idCliente, updates) => {
        const updated = clients.map(c => {
          if (c.idCliente === idCliente) {
            const mod = { ...c, ...updates };
            if (updates.telefono) {
              mod.telefonos = [{ num: updates.telefono, tipo: "WHATSAPP" }];
            }
            return mod;
          }
          return c;
        });
        setClients(updated);

        if (usuarioAuth && (usuarioAuth.idCliente === idCliente || String(usuarioAuth.correo || '').toLowerCase() === String(updates.correo || '').toLowerCase())) {
          setUsuarioAuth({
            ...usuarioAuth,
            telefono: updates.telefono || usuarioAuth.telefono,
            direccion: updates.direccion || usuarioAuth.direccion
          });
        }
        showNotif("✔ Datos de contacto actualizados exitosamente.");
      };

      // ELIMINAR CLIENTE
      const handleEliminarCliente = (idCliente) => {
        setClients(clients.filter(c => c.idCliente !== idCliente));
        showNotif("Cliente eliminado del directorio.");
      };

      // ACTUALIZAR ESPECIFICACIONES DE MASCOTA (CON PERSISTENCIA REAL EN MYSQL)
      const handleActualizarMascota = (idCliente, idMascota, updates) => {
        const updated = clients.map(c => {
          if (c.idCliente === idCliente) {
            return {
              ...c,
              mascotas: (c.mascotas || []).map(m => m.idMascota === idMascota ? { ...m, ...updates } : m)
            };
          }
          return c;
        });
        setClients(updated);
        showNotif("✔ Ficha técnica de la mascota actualizada en MySQL.");

        fetch(`${API_BASE}/clientes/${idCliente}/mascotas/${idMascota}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idMascota: idMascota,
            idCliente: idCliente,
            nombre: updates.nombre,
            color: updates.color || 'No especificado',
            pesoKg: updates.peso || updates.pesoKg,
            temperamento: (updates.temperamento || 'DOCIL').toUpperCase().includes('BRAVO') ? 'AGRESIVO' : (updates.temperamento || 'DOCIL').toUpperCase(),
            alergiasCondiciones: updates.alergias || updates.alergiasCondiciones || 'Ninguna',
            vacunasAlDia: true
          })
        }).then(res => res.json()).then(res => {
          if (res.success) {
            console.log("✔ Ficha técnica sincronizada exitosamente en base de datos.");
          }
        }).catch(() => {});
      };

      // GUARDAR CONFIGURACIÓN GLOBAL DEL NEGOCIO (HORARIOS, DIAS CERRADOS, CAPACIDAD, TIEMPOS)
      const handleGuardarConfiguracion = (nuevaCfg) => {
        setBusinessConfig(nuevaCfg);
        fetch(`${API_BASE}/configuracion`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevaCfg)
        })
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              if (res.data) setBusinessConfig(res.data);
              showNotif("✔ Parámetros y reglas de agendamiento actualizadas en MySQL.");
            } else {
              showNotif(res.message || "Error al actualizar configuración.", "error");
            }
          })
          .catch(() => {
            showNotif("Parámetros guardados localmente.");
          });
      };

      // CANCELAR CITA (CON RESPETO DE POLÍTICA DE HORAS DE ANTICIPACIÓN)
      const handleCancelarCita = (idCita, esAdmin = false) => {
        fetch(`${API_BASE}/citas/${idCita}/cancelar?esAdmin=${esAdmin}`, {
          method: 'PUT'
        })
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              setCitas(prev => prev.map(c => c.idCita === idCita ? { ...c, estado: 'CANCELADA' } : c));
              showNotif(`✔ Cita #${idCita} cancelada correctamente.`);
            } else {
              showNotif(res.message || "No se pudo cancelar la cita.", "error");
            }
          })
          .catch(() => {
            setCitas(prev => prev.map(c => c.idCita === idCita ? { ...c, estado: 'CANCELADA' } : c));
            showNotif(`Cita #${idCita} cancelada.`);
          });
      };

      // ELIMINAR MASCOTA
      const handleEliminarMascota = (idCliente, idMascota) => {
        const updated = clients.map(c => {
          if (c.idCliente === idCliente) {
            return {
              ...c,
              mascotas: (c.mascotas || []).filter(m => m.idMascota !== idMascota)
            };
          }
          return c;
        });
        setClients(updated);
        showNotif("Mascota eliminada del expediente.");
      };

      // ACTUALIZAR SERVICIO / TARIFA
      const handleActualizarServicio = (idServicio, updates) => {
        const updated = services.map(s => s.idServicio === idServicio ? { ...s, ...updates } : s);
        setServices(updated);
        showNotif("✔ Tarifa y parámetros del servicio actualizados.");
      };

      return (
        <div className="min-h-screen flex flex-col transition-colors duration-200 app-root">
          {/* HEADER SUPERIOR */}
          {/* HEADER CONDICIONAL */}
          {!usuarioAuth && currentTab === 'inicio' ? (
            <header className="gemini-nav">
              <div className="nav-row">
                <a className="brand" href="#inicio" onClick={(e) => { e.preventDefault(); setMenuMovilAbierto(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
                  <img className="brand-mark-img" src="./logo-navbar.png" alt="CanStyling logo" />
                  CanStyling
                </a>
                <ul className="nav-links">
                  <li><a href="#servicios" onClick={() => setMenuMovilAbierto(false)}>Servicios</a></li>
                  <li><a href="#videos" onClick={() => setMenuMovilAbierto(false)}>Videos</a></li>
                  <li><a href="#historias" onClick={() => setMenuMovilAbierto(false)}>Historias</a></li>
                  <li><a href="#nosotros" onClick={() => setMenuMovilAbierto(false)}>Por qué nosotros</a></li>
                  <li><a href="#faq" onClick={() => setMenuMovilAbierto(false)}>Preguntas</a></li>
                </ul>
                <div className="nav-actions-desktop" style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <button
                    onClick={() => setTemaOscuro(!temaOscuro)}
                    style={{ background: 'var(--card)', color: 'var(--ink)', border: '1px solid var(--border)', padding: '9px 12px', borderRadius: '9px', fontSize: '13px', fontWeight: '600', cursor: 'pointer' }}
                    title="Alternar tema visual Claro / Oscuro"
                  >
                    {temaOscuro ? '☀️ Claro' : '🌙 Oscuro'}
                  </button>
                  <button
                    onClick={() => setModalMode('login')}
                    style={{ background: 'var(--ink)', color: 'var(--cream)', border: 'none', padding: '10px 16px', borderRadius: '9px', fontSize: '13.5px', fontWeight: '600', cursor: 'pointer' }}
                  >
                    🔑 Ingresar
                  </button>
                  <a className="nav-cta" href="https://wa.me/573001234567?text=Hola%20CanStyling%2C%20quiero%20agendar%20una%20cita%20para%20mi%20mascota." target="_blank" rel="noreferrer" style={{ textDecoration: 'none' }}>
                    Agendar por WhatsApp
                  </a>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <button
                    onClick={() => setTemaOscuro(!temaOscuro)}
                    className="md:hidden"

                      const cliObj = clients.find(c => `${c.nombres} ${c.apellidos}`.toLowerCase() === (f.cliente || '').toLowerCase()) || clients[0];

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                          idCita: matchingCita ? matchingCita.idCita : null,
                          idCliente: cliObj ? cliObj.idCliente : 1,
                          subtotal: f.total,
                          iva: 0.00,
                          descuento: 0.00,
                          total: f.total,
                          metodoPago: f.metodo === 'EFECTIVO' ? 'EFECTIVO' : (f.metodo && f.metodo.includes('TARJETA') ? 'TARJETA_DEBITO' : 'TRANSFERENCIA_NEQUI_DAVIPLATA'),

                            cantidad: 1,
                            precioUnitario: f.total,
                            subtotal: f.total
                          }]
                        })

          {modalMode === 'recuperar' && (
            <ModalRecuperarPassword
              users={users}
              setUsers={setUsers}
              clients={clients}
              onClose={() => setModalMode(null)}
              onGoLogin={() => setModalMode('login')}
              showNotif={showNotif}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // 3. VISTA: EXPLORADOR DE BASE DE DATOS EN VIVO (TABLAS SQL)
    // ==========================================
    function DatabaseExplorerView({ users, estilistas, clients, citas, services, inventory, facturas, onResetSeed, showNotif }) {
      const [selectedTable, setSelectedTable] = useState('citas');
      const [viewMode, setViewMode] = useState('tabla'); // 'tabla' | 'json' | 'sql'
      const [filtroTexto, setFiltroTexto] = useState('');

      // Desglosar mascotas desde clientes para ver como tabla relacional
      const mascotasTable = clients.flatMap(c => 
        (c.mascotas || []).map(m => ({
          idMascota: m.idMascota,
          idCliente: c.idCliente,
          dueño: `${c.nombres} ${c.apellidos}`,
          correoDueño: c.correo,
          nombreMascota: m.nombre,
          raza: m.raza,
          pesoKg: m.peso,
          temperamento: m.temperamento || 'Dócil',
          alergias: m.alergias || 'Ninguna'
        }))
      );

      const tableDataMap = {
        citas: { title: 'citas (Turnos & Anti-IDOR)', data: citas, storageKey: 'canstyling_citas' },
        clientes: { title: 'clientes (Tutores Caninos)', data: clients, storageKey: 'canstyling_clients' },
        mascotas: { title: 'mascotas (Pacientes Caninos)', data: mascotasTable, storageKey: 'canstyling_clients (FK)' },
        estilistas: { title: 'estilistas (Peluqueros)', data: estilistas, storageKey: 'canstyling_estilistas' },
        usuarios: { title: 'usuarios & roles (Credenciales)', data: users, storageKey: 'canstyling_users' },
        servicios: { title: 'servicios & tarifas', data: services, storageKey: 'canstyling_services' },
        inventario_insumos: { title: 'inventario_insumos (Stock)', data: inventory, storageKey: 'canstyling_inventory' },
        facturas: { title: 'facturas (POS Ventas)', data: facturas, storageKey: 'canstyling_facturas' }
      };

      const current = tableDataMap[selectedTable] || tableDataMap.citas;
      const currentList = current.data || [];

      const filteredList = currentList.filter(item => {
        if (!filtroTexto.trim()) return true;
        return JSON.stringify(item).toLowerCase().includes(filtroTexto.toLowerCase().trim());
      });

      const totalRegistros = users.length + estilistas.length + clients.length + mascotasTable.length + citas.length + services.length + inventory.length + facturas.length;

      // Generar script SQL INSERT compatible con MySQL
      const generateSqlInserts = () => {
        if (filteredList.length === 0) return "-- No hay registros para exportar en esta tabla.";
        let sql = `-- ==========================================================================\n`;
        sql += `-- EXPORTACIÓN DE TABLA: ${selectedTable.toUpperCase()} (Base de datos: peluqueria_canina_db)\n`;
        sql += `-- Generado en tiempo real con sintaxis 100% compatible con MySQL\n`;
        sql += `-- ==========================================================================

`;

        if (selectedTable === 'clientes') {
          filteredList.forEach(c => {
            const idCli = c.idCliente || 'NULL';
            const idUsu = c.idUsuario ? c.idUsuario : 'NULL';
            const correo = String(c.correo || '').replace(/'/g, "''");
            const passHash = c.passwordHash ? `'${c.passwordHash}'` : "'D0K8vu34kWCmz3zK/mgIDyqvtzs+8Fffa14i8SlNChA='";
            const nombres = String(c.nombres || '').replace(/'/g, "''");
            const apellidos = String(c.apellidos || '').replace(/'/g, "''");
            const canal = String(c.canal || 'WEB').replace(/'/g, "''");
            sql += `INSERT INTO clientes (id_cliente, id_usuario, correo, password_hash, nombres, apellidos, canal_origen, observaciones) VALUES (${idCli}, ${idUsu}, '${correo}', ${passHash}, '${nombres}', '${apellidos}', '${canal}', 'Cliente registrado');\n`;
            if (c.telefonos && c.telefonos.length > 0) {
              c.telefonos.forEach(t => {
                sql += `INSERT INTO cliente_telefonos (id_cliente, numero_telefono, tipo_telefono, es_principal) VALUES (${idCli}, '${t.num}', '${t.tipo || 'WHATSAPP'}', 1);\n`;
              });
            }
          });
          return sql;
        }

        if (selectedTable === 'mascotas') {
          filteredList.forEach(m => {
            const idMasc = m.idMascota || 'NULL';
            const idCli = m.idCliente || 1;
            const nom = String(m.nombreMascota || m.nombre || '').replace(/'/g, "''");
            const peso = parseFloat(m.pesoKg || m.peso || 5.0);
            let temp = (m.temperamento || 'DOCIL').toUpperCase();
            if (temp.includes('BRAVO') || temp.includes('AGRESIVO')) temp = 'AGRESIVO';
            else if (temp.includes('NERVIOSO')) temp = 'NERVIOSO';
            else if (temp.includes('HIPERACTIVO')) temp = 'HIPERACTIVO';
            else if (temp.includes('TÍMIDO') || temp.includes('TIMIDO')) temp = 'TIMIDO';
            else temp = 'DOCIL';
            const alergias = String(m.alergias || 'Ninguna conocida').replace(/'/g, "''");

            sql += `INSERT INTO mascotas (id_mascota, id_cliente, id_raza, nombre, genero, peso_kg, temperamento, alergias_condiciones, vacunas_al_dia, estado) VALUES (${idMasc}, ${idCli}, 5, '${nom}', 'MACHO', ${peso}, '${temp}', '${alergias}', 1, 'ACTIVO');\n`;
          });
          return sql;
        }

        filteredList.forEach(row => {
          const keys = Object.keys(row).filter(k => typeof row[k] !== 'object' || row[k] === null);
          const values = keys.map(k => {
            const val = row[k];
            if (val === null || val === undefined) return "NULL";
            if (typeof val === 'number' || typeof val === 'boolean') return val;
            return `'${String(val).replace(/'/g, "''")}'`;
          });
          sql += `INSERT INTO ${selectedTable} (${keys.join(', ')}) VALUES (${values.join(', ')});\n`;
        });
        return sql;
      };

      const handleCopiarSql = () => {
        navigator.clipboard.writeText(generateSqlInserts());
        showNotif("Sentencias SQL copiadas al portapapeles. ¡Listas para pegar en MySQL Workbench / phpMyAdmin!");
      };

      const handleCopiarJson = () => {
        navigator.clipboard.writeText(JSON.stringify(currentList, null, 2));
        showNotif("Datos JSON copiados al portapapeles.");
      };

      return (
        <div className="space-y-6">
          {/* BANNER VISOR BD */}
          <div className="bg-gradient-to-r from-slate-950 via-slate-900 to-cyan-950 text-white p-6 md:p-8 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border border-cyan-900/40">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] bg-cyan-500/20 text-cyan-400 font-black px-3 py-1 rounded-full uppercase border border-cyan-500/40">
                  Motor de Base de Datos MySQL & Persistencia Local
                </span>
                <span className="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado
                </span>
              </div>
              <h2 className="text-2xl md:text-3xl font-black mt-2 tracking-tight">🗄️ Explorador de Tablas & Relaciones BD</h2>
              <p className="text-xs text-slate-300 max-w-2xl mt-1">
                Consulte en vivo todos los registros creados por clientes, citas, mascotas, estilistas y facturas.
                Toda la información se conecta relacionalmente mediante llaves primarias y foráneas (<code className="text-cyan-300 font-mono">id_cliente</code>, <code className="text-cyan-300 font-mono">id_mascota</code>, <code className="text-cyan-300 font-mono">id_estilista</code>, <code className="text-cyan-300 font-mono">id_servicio</code>).
              </p>
            </div>

            <div className="flex flex-wrap gap-2">
              <button
                onClick={onResetSeed}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-700 transition shadow"
              >
                🔄 Reiniciar Semilla (Seed)
              </button>
            </div>
          </div>

          {/* TARJETAS DE RESUMEN DE LA BASE DE DATOS */}
          <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2.5 text-xs font-bold">
            {Object.keys(tableDataMap).map(key => {
              const info = tableDataMap[key];
              const isSel = selectedTable === key;
              return (
                <button
                  key={key}
                  onClick={() => { setSelectedTable(key); setFiltroTexto(''); }}
                  className={`p-3 rounded-2xl text-left border transition flex flex-col justify-between ${
                    isSel
                      ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-lg scale-105 font-black'
                      : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
                  }`}
                >
                  <span className="text-[10px] uppercase tracking-wider block opacity-75">{key}</span>
                  <div className="flex items-baseline justify-between mt-1">
                    <span className="text-lg font-black">{info.data.length}</span>
                    <span className="text-[9px] opacity-75">filas</span>
                  </div>
                </button>
              );
            })}
          </div>

          {/* CONTENEDOR PRINCIPAL DE LA TABLA SELECCIONADA */}
          <div className="glass-panel p-6 rounded-3xl shadow-lg space-y-4">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-4">
              <div>
                <span className="text-[10px] bg-slate-100 text-slate-700 font-extrabold px-2.5 py-1 rounded-full uppercase font-mono">
                  Tabla: {selectedTable} • Almacenamiento: {current.storageKey}
                </span>
                <h3 className="text-lg font-black text-slate-900 mt-1">
                  Registros de <span className="text-cyan-700">{current.title}</span> ({filteredList.length} de {currentList.length})
                </h3>
              </div>

              {/* SELECTOR DE VISTA: TABLA / JSON / SQL */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                  <button
                    onClick={() => setViewMode('tabla')}
                    className={`px-3 py-1.5 rounded-lg transition ${viewMode === 'tabla' ? 'bg-slate-900 text-white shadow' : 'text-slate-600'}`}
                  >
                    📊 Cuadrícula
                  </button>
                  <button
                    onClick={() => setViewMode('json')}
                    className={`px-3 py-1.5 rounded-lg transition ${viewMode === 'json' ? 'bg-slate-900 text-white shadow' : 'text-slate-600'}`}
                  >
                    🧩 JSON Crudo
                  </button>
                  <button
                    onClick={() => setViewMode('sql')}
                    className={`px-3 py-1.5 rounded-lg transition ${viewMode === 'sql' ? 'bg-slate-900 text-white shadow' : 'text-slate-600'}`}
                  >
                    💾 SQL INSERTs
                  </button>
                </div>

                {viewMode === 'sql' && (
                  <button
                    onClick={handleCopiarSql}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition flex items-center gap-1"
                  >
                    <span>📋</span> Copiar SQL
                  </button>
                )}

                {viewMode === 'json' && (
                  <button
                    onClick={handleCopiarJson}
                    className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition flex items-center gap-1"
                  >
                    <span>📋</span> Copiar JSON
                  </button>
                )}
              </div>
            </div>

            {/* BUSCADOR DENTRO DE LA TABLA */}
            <div className="flex items-center gap-3">
              <input
                type="text"
                placeholder={`🔍 Filtrar en la tabla ${selectedTable} (por cliente, mascota, ID, estado, etc.)...`}
                value={filtroTexto}
                onChange={e => setFiltroTexto(e.target.value)}
                className="w-full border p-2.5 rounded-xl text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-cyan-500"
              />
              {filtroTexto && (
                <button
                  onClick={() => setFiltroTexto('')}
                  className="text-xs text-slate-500 hover:text-slate-800 font-bold whitespace-nowrap"
                >
                  ✕ Limpiar
                </button>
              )}
            </div>

            {/* MODO 1: CUADRÍCULA DE DATOS */}
            {viewMode === 'tabla' && (
              <div className="overflow-x-auto border rounded-2xl bg-white shadow-sm">
                {filteredList.length === 0 ? (
                  <div className="text-center py-10 text-slate-400 text-xs">
                    <p className="text-2xl mb-1">📭</p>
                    <p>No hay registros coincidentes en la tabla <b>{selectedTable}</b>.</p>
                  </div>
                ) : (
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-white uppercase text-[10px] tracking-wider">
                      <tr>
                        {Object.keys(filteredList[0]).map(col => (
                          <th key={col} className="p-3 whitespace-nowrap border-b border-slate-800">
                            {col}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      {filteredList.map((row, idx) => (
                        <tr key={idx} className="hover:bg-cyan-50/40 transition">
                          {Object.keys(filteredList[0]).map(col => {
                            const val = row[col];
                            const isId = col.toLowerCase().startsWith('id') || col.toLowerCase().includes('token');
                            const isObject = typeof val === 'object' && val !== null;
                            return (
                              <td key={col} className="p-3 text-slate-800 whitespace-nowrap">
                                {isObject ? (
                                  <span className="text-[10px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-sans">
                                    {Array.isArray(val) ? `[${val.length} items]` : JSON.stringify(val).substring(0, 25) + '...'}
                                  </span>
                                ) : isId ? (
                                  <span className="font-bold text-cyan-800 bg-cyan-50 px-2 py-0.5 rounded border border-cyan-200 text-[11px]">
                                    {String(val)}
                                  </span>
                                ) : (
                                  String(val ?? 'NULL')
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}

            {/* MODO 2: JSON CRUDO */}
            {viewMode === 'json' && (
              <div className="bg-slate-950 text-emerald-400 p-4 rounded-2xl font-mono text-xs overflow-x-auto max-h-[500px] shadow-inner">
                <pre>{JSON.stringify(filteredList, null, 2)}</pre>
              </div>
            )}

            {/* MODO 3: SENTENCIAS SQL INSERT */}
            {viewMode === 'sql' && (
              <div className="space-y-2">
                <p className="text-xs text-slate-500">
                  Sentencias SQL generadas para importar directamente a <b>MySQL Server</b> o <b>MySQL Workbench</b>:
                </p>
                <div className="bg-slate-950 text-cyan-300 p-4 rounded-2xl font-mono text-xs overflow-x-auto max-h-[500px] shadow-inner">
                  <pre>{generateSqlInserts()}</pre>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
